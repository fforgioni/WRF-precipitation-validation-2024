name: wrf-validation

channels:
  - conda-forge

dependencies:

  # Python
  - python=3.11

  # Numerical computing
  - numpy
  - scipy
  - pandas
  - xarray
  - dask

  # Meteorological data formats
  - netcdf4
  - h5netcdf
  - cfgrib
  - eccodes
  - cftime

  # Geospatial analysis
  - cartopy
  - geopandas
  - shapely
  - pyproj

  # Statistical analysis
  - scikit-learn
  - statsmodels

  # Data visualization
  - matplotlib
  - seaborn

  # Data acquisition
  - requests
  - urllib3

  # Spreadsheet processing
  - openpyxl

  # Interactive analysis
  - jupyterlab
  - ipykernel
